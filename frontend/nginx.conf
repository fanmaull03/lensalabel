limit_req_zone $binary_remote_addr zone=photo_rate:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=manual_rate:10m rate=12r/m;
limit_conn_zone $server_name zone=photo_concurrency:1m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 11m;

    location = /identify {
        limit_req zone=photo_rate burst=1 nodelay;
        limit_conn photo_concurrency 2;
        proxy_read_timeout 240s;
        proxy_pass http://backend:8000;
    }

    location = /identify-manual {
        client_max_body_size 32k;
        limit_req zone=manual_rate burst=3 nodelay;
        proxy_read_timeout 240s;
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location = /ready {
        proxy_read_timeout 120s;
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
